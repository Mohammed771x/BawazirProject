org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# `org.gradle.java.home` is deliberately absent.
#
# It used to name a Windows JDK — `C:/Program Files/Eclipse Adoptium/...` —
# committed from whichever machine last touched this. That made the Android
# build impossible on every other machine, which is a strange thing for a
# checked-in file to decide: `flutter build apk` died with "Java home supplied
# is invalid" and nothing pointed at this line.
#
# Left out, Gradle finds the JDK itself — from JAVA_HOME, or the one bundled
# with Android Studio. If a specific JDK is ever needed, set JAVA_HOME in the
# shell or `flutter config --jdk-dir=...`; both are per-machine, which is what
# a JDK path is.
