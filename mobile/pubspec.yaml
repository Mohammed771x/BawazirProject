name: wordos
description: "WordOS — Word Operating System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  intl: ^0.20.2
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  # Opens the support chat in WhatsApp (ADR-055).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a real device against the real backend. Widget tests
  # prove the UI; this proves the integration.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
